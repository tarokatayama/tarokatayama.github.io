{% include site-theme.html %}

<div class="site-top">
  <div class="site-header">
    <a class="logo" href="/" aria-label="Taro Katayama, home">
      <svg viewBox="0 0 64 64" role="img" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
        <circle class="ring" cx="32" cy="32" r="30" fill="none" stroke="#9caf88" stroke-width="2" stroke-opacity="0.85"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="#9caf88" stroke-width="0.75" stroke-opacity="0.4"/>
        <text x="32" y="43" text-anchor="middle" fill="#9caf88" font-family="'Cormorant Garamond', Georgia, serif" font-style="italic" font-weight="700" font-size="32" letter-spacing="-3">TK</text>
      </svg>
    </a>
    <div class="name-block">
      <h1><a href="/">Taro Katayama</a></h1>
      <p>Environmental Scientist</p>
    </div>
    <div aria-hidden="true"></div>
  </div>

  <nav class="tabs" aria-label="Site sections">
    {% for tab in site.data.home_tabs %}
      <a href="{{ tab.url }}"{% if tab.external %} target="_blank" rel="noopener"{% endif %}>{{ tab.title }}</a>
    {% endfor %}
  </nav>
</div>

<script>
  // Highlight the tab for the current page (done in the browser so the header can be cached)
  document.querySelectorAll('.tabs a').forEach(function (a) {
    if (!a.target && a.pathname.replace(/\/$/, '') === location.pathname.replace(/\/$/, '')) {
      a.classList.add('active');
      a.setAttribute('aria-current', 'page');
    }
  });
</script>
