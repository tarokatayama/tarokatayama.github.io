<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap');

:root {
  --bg: #000;
  --panel: #101215;
  --line: #24272c;
  --text: #ececec;
  --body: #d4d6d9;
  --muted: #9aa0a8;
  --accent: #0ea1c5;
  --accent-soft: rgba(14, 161, 197, 0.14);
  --sage: #9caf88;
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

/* ---------- Site-wide dark theme (all pages) ---------- */
html, body { background: var(--bg) !important; color: var(--body); font-family: var(--sans); }
body, p, li, td, .page__content, .page__meta, .archive__item-excerpt, .author__bio { color: var(--body); }
h1, h2, h3, h4, h5, h6, .page__title, .archive__item-title, .archive__subtitle, .page__lead, .author__name {
  color: var(--text) !important; font-family: var(--serif); border-color: var(--line) !important;
}
a { color: var(--accent); }
a:hover { color: #5cc8e3; }
.archive__item-title a, .archive__item-title a:hover { color: var(--text); }
hr, table, th, td, blockquote { border-color: var(--line) !important; }
th { background: #16181c !important; color: var(--text) !important; }
blockquote { color: var(--muted); border-left: 3px solid var(--accent) !important; }
code, pre, kbd, .highlight, .highlight pre { background: #16181c !important; color: #e6e6e6 !important; }
.notice, .notice--info { background: var(--panel) !important; color: var(--body) !important; }
.btn { background: var(--accent) !important; color: #001419 !important; }
.page__footer { background: var(--bg) !important; border-top: 1px solid var(--line); color: var(--muted); }
.page__footer a, .page__footer-follow a, .page__footer-copyright { color: var(--muted) !important; }

/* Remove the author profile sidebar (photo, name, titles) on every page,
   and let the page content fill the width it freed up */
.sidebar, .author__avatar, .author__content, .author__urls-wrapper { display: none !important; }
.page, .archive, .page__related, .page__comments {
  float: none !important;
  width: 100% !important;
  max-width: 1100px;
  margin-left: auto !important;
  margin-right: auto !important;
  padding-left: 1rem !important;
  padding-right: 1rem !important;
  box-sizing: border-box;
}

/* Cards that carry their own light styling on the GIS portfolio and contact pages */
.portfolio-item, .contact-card { background: var(--panel) !important; border: 1px solid var(--line); box-shadow: none !important; }
.portfolio-preview { background: #000 !important; }
.portfolio-item h3 { color: var(--text) !important; }
.portfolio-item p { color: #b8bcc2 !important; }

/* ---------- Header: logo, name, tabs ---------- */
.site-top { border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
.site-header { max-width: 1400px; margin: 0 auto; padding: 1.25rem 1rem 0.75rem; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.logo { justify-self: start; display: block; width: 64px; height: 64px; }
.logo svg { width: 100%; height: 100%; display: block; }
.logo:hover .ring { stroke-opacity: 1; }
.name-block { text-align: center; }
.name-block h1 { font-size: 2.6rem; line-height: 1.1; margin: 0; border: 0; }
.name-block h1 a { color: var(--text) !important; text-decoration: none; }
.name-block p { color: var(--muted); font-size: 1.05rem; margin: 0.4rem 0 0; }
.tabs { max-width: 1400px; margin: 0 auto; padding: 0 1rem; display: flex; justify-content: center; gap: 0.25rem; overflow-x: auto; }
.tabs a { color: var(--muted) !important; padding: 0.85rem 1rem; font-weight: 500; font-size: 0.95rem; white-space: nowrap; border-bottom: 3px solid transparent; text-decoration: none; }
.tabs a:hover { color: var(--text) !important; }
.tabs a.active { color: var(--text) !important; border-bottom-color: var(--accent); }

/* ---------- Home and About me pages ---------- */
.dash { margin: 0 auto; padding: 0 1rem 3rem; box-sizing: border-box; }
.dash *, .dash *::before, .dash *::after { box-sizing: border-box; }
.dash.wide { max-width: 1400px; }
.dash.narrow { max-width: 820px; }

.stories { display: grid; grid-template-columns: 360px minmax(0, 1fr) 360px; grid-template-areas: "blog main talks"; align-items: start; }
.story { position: relative; padding: 0 1.75rem; }
.story--blog { grid-area: blog; padding-left: 0; border-right: 1px solid var(--line); }
.story--main { grid-area: main; }
.story--talks { grid-area: talks; padding-right: 0; border-left: 1px solid var(--line); }
.story__img { display: block; width: 100%; object-fit: cover; border-radius: 4px; aspect-ratio: 4 / 3; margin-bottom: 1rem; }
.story--main .story__img { aspect-ratio: 4 / 3; margin-bottom: 1.25rem; }
.story__img--blank { background: var(--accent-soft); }
.story__title { font-size: 1.4rem; line-height: 1.25; margin: 0 0 0.4rem; border: 0; }
.story--main .story__title { font-size: 2.2rem; line-height: 1.15; margin-bottom: 0.6rem; }
.story__title a { color: var(--text) !important; text-decoration: none; }
.story__title a::after { content: ""; position: absolute; inset: 0; }
.story:hover .story__title a { color: var(--accent) !important; }
.story__blurb { color: var(--muted); font-size: 1rem; line-height: 1.5; margin: 0; }
.story--main .story__blurb { font-size: 1.1rem; color: var(--body); }

.about-page h1.page-title { font-size: 2rem; margin: 0 0 1.25rem; border: 0; }
.about-page img.portrait { width: 100%; max-height: 420px; object-fit: cover; border-radius: 6px; margin-bottom: 1.5rem; display: block; }
.about-page p { line-height: 1.65; margin: 0 0 1rem; }
.about-page h2 { font-size: 1.35rem; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; margin: 0; }
.rows li:last-child { border-bottom: 0; }
.rows li span { color: var(--muted); text-align: right; }
.edu { margin-bottom: 0.9rem; line-height: 1.45; }
.edu em { color: var(--muted); font-style: normal; display: block; }


/* ---------- Writing page ---------- */
.writing h1.page-title { font-size: 2rem; margin: 0 0 1.5rem; border: 0; }
.work { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.5rem; margin-bottom: 1.5rem; }
.work h2 { font-size: 1.5rem; line-height: 1.25; margin: 0 0 0.4rem; border: 0; }
.work--featured h2 { font-size: 1.9rem; }
.work .meta { color: var(--muted); font-size: 0.9rem; margin: 0 0 0.75rem; line-height: 1.5; }
.work .badge { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 0.2rem 0.7rem; font-size: 0.78rem; font-weight: 600; margin-bottom: 0.75rem; }
.work .links { margin: 0.9rem 0 0; font-size: 0.95rem; display: flex; gap: 1.25rem; flex-wrap: wrap; }
.preview { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #fff; display: block; }
.work--featured .preview { height: 620px; }
.work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.work-grid .work { margin-bottom: 0; }
.work-grid .preview { height: 460px; }
@media (max-width: 900px) {
  .work-grid { grid-template-columns: 1fr; }
  .work--featured .preview { height: 460px; }
}

@media (max-width: 1250px) {
  .stories { grid-template-columns: 270px minmax(0, 1fr) 270px; }
}
@media (max-width: 900px) {
  .stories { grid-template-columns: 1fr 1fr; grid-template-areas: "main main" "blog talks"; row-gap: 2rem; }
  .story--main { padding: 0 0 1.5rem; border-bottom: 1px solid var(--line); }
  .story--blog { padding-right: 1rem; }
  .story--talks { padding-left: 1rem; }
}
@media (max-width: 560px) {
  .stories { grid-template-columns: 1fr; grid-template-areas: "main" "blog" "talks"; }
  .story--blog, .story--talks { padding: 0; border: 0; }
  .site-header { grid-template-columns: auto 1fr; }
  .name-block { text-align: left; padding-left: 1rem; }
  .name-block h1 { font-size: 1.9rem; }
  .tabs { justify-content: flex-start; }
  .story--main .story__title { font-size: 1.8rem; }
}
</style>
