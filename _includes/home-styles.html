<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap');

:root {
  --bg: #000;
  --panel: #101215;
  --line: #24272c;
  --text: #ececec;
  --muted: #9aa0a8;
  --accent: #0ea1c5;
  --accent-soft: rgba(14, 161, 197, 0.14);
  --serif: 'Source Serif 4', Georgia, serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

html, body { background: var(--bg); color: var(--text); font-family: var(--sans); }

/* Hide the theme's top bar (the grey box and its CV / Project Showcase / Talks / Blog links) */
.masthead { display: none !important; }
.page__footer { background: var(--bg) !important; border-top: 1px solid var(--line); color: var(--muted); }
.page__footer a, .page__footer-follow a { color: var(--muted) !important; }

.dash { max-width: 820px; margin: 0 auto; padding: 2rem 1rem 3rem; box-sizing: border-box; }
.dash *, .dash *::before, .dash *::after { box-sizing: border-box; }
.dash a { color: var(--accent); text-decoration: none; }
.dash a:hover { text-decoration: underline; }
.dash a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dash h1, .dash h2, .dash h3 { font-family: var(--serif); color: var(--text); margin: 0; border: 0; }
.dash p { margin: 0 0 1rem; line-height: 1.65; color: #d4d6d9; }

/* Name and tabs */
.name-block { text-align: center; padding: 0.5rem 0 1.25rem; }
.name-block h1 { font-size: 2.6rem; line-height: 1.1; }
.name-block h1 a { color: var(--text) !important; }
.name-block h1 a:hover { text-decoration: none; }
.name-block p { color: var(--muted); font-size: 1.05rem; margin: 0.4rem 0 0; }

.tabs { display: flex; justify-content: center; gap: 0.25rem; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 2rem; }
.tabs a { color: var(--muted) !important; padding: 0.85rem 1rem; font-weight: 500; font-size: 0.95rem; white-space: nowrap; border-bottom: 3px solid transparent; }
.tabs a:hover { color: var(--text) !important; text-decoration: none; }
.tabs a.active { color: var(--text) !important; border-bottom-color: var(--accent); }

/* Home page cards: the whole card is clickable */
.cards { display: grid; gap: 1.25rem; }
.card { position: relative; display: grid; grid-template-columns: 1fr 260px; gap: 1.5rem; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1.25rem 1.5rem; }
.card:hover { border-color: var(--accent); }
.card h2 { font-size: 1.6rem; margin-bottom: 0.5rem; }
.card h2 a { color: var(--text) !important; }
.card h2 a:hover { text-decoration: none; }
.card h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 10px; }
.card p { color: #b8bcc2; margin: 0 0 0.5rem; }
.card .meta { color: var(--muted); font-size: 0.85rem; }
.card img, .card .img-blank { width: 100%; height: 170px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); display: block; }
.card .img-blank { background: var(--accent-soft); }
.talk-line { color: #d4d6d9; font-size: 0.95rem; padding: 0.2rem 0; }

/* About me page */
.about-page h1.page-title { font-size: 2rem; margin-bottom: 1.25rem; }
.about-page img.portrait { width: 100%; max-height: 420px; object-fit: cover; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 1.5rem; display: block; }
.about-page h2 { font-size: 1.35rem; margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); font-size: 0.95rem; }
.rows li:last-child { border-bottom: 0; }
.rows li span { color: var(--muted); text-align: right; }
.edu { margin-bottom: 0.9rem; line-height: 1.45; }
.edu em { color: var(--muted); font-style: normal; display: block; }

@media (max-width: 720px) {
  .card { grid-template-columns: 1fr; }
  .card img, .card .img-blank { order: -1; height: 190px; }
  .tabs { justify-content: flex-start; }
  .name-block h1 { font-size: 2.1rem; }
}
</style>
